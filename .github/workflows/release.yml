# Builds the app for macOS, Windows and Linux and attaches the files to a
# GitHub release — when a version tag is pushed (v0.2.0), or by hand.
#
# Not on every push: three builds, one of them on a macOS runner, for a change
# of a comment. Tests run on every push (tests.yml).
#
# PyInstaller does not build across platforms, hence one runner per system.
# The files: OpenETV-<version>-macOS.dmg, -Windows.zip, -Linux.tar.gz. They are
# not signed: macOS warns at the first start (README, "Installing").
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # to create the release and attach the files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENETV_APP_DIR: ${{ github.workspace }}/app-out
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: The tag names the version of the app
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('tools/etvlib/__init__.py').read_text())[1])")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, but etvlib/__init__.py says $version."; exit 1; }

      - name: Environment
        run: python -m venv .venv

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -m pip install --upgrade pip
          bash packaging/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          powershell -ExecutionPolicy Bypass -File packaging\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: OpenETV-${{ runner.os }}
          path: |
            app-out/*.dmg
            app-out/*.zip
            app-out/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "OpenETV ${GITHUB_REF_NAME#v}" --generate-notes --draft
